<!DOCTYPE html>
<!-- The double-brace placeholders are filled in from meeting.conf by build.sh. -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"><style>
.wrap{display:flex;align-items:center;justify-content:center}
.stack{text-align:center;transform:translateY(-12px)}
.stack img{height:238px}
.club{margin-top:36px;color:#fff;font-weight:700;font-size:47px;letter-spacing:5px}
.rule{width:130px;height:3px;background:#F2DF74;margin:34px auto}
.phrase{color:#fff;font-weight:500;font-size:35px;letter-spacing:1.5px}
.url{margin-top:26px;color:rgba(255,255,255,.78);font-weight:400;font-size:22px;letter-spacing:.5px}
.meet{margin-top:30px;color:#F2DF74;font-weight:600;font-size:24px;letter-spacing:4px}
/* A club that doesn't publish a standing meeting time leaves MEETING_TIME
   empty and gets exactly the card it had before this line existed, margin
   included. Keep this rule if you add more optional lines. */
.meet:empty{display:none}
.credit{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.55);font-size:15px;font-weight:400;letter-spacing:.5px;white-space:nowrap}

/* Portrait: the smallest fork. The stack is already a centred column and the
   stage centre is the safe-zone centre, so only the logo, the club line (which
   would otherwise run the full 1080px) and the credit's offset move. */
body[data-aspect="portrait"] .stack img{height:190px}
body[data-aspect="portrait"] .club{font-size:38px;letter-spacing:4px}
body[data-aspect="portrait"] .credit{bottom:calc(var(--safe-y) + 36px)}
</style></head><body data-aspect="{{ASPECT}}">
<div class="wrap">
  <div class="stack">
    <img src="{{LOGO}}" alt="" data-layer="1">
    <div class="club" data-layer="1">{{CLUB_NAME}}</div>
    <div class="rule" data-layer="2"></div>
    <div class="phrase" data-layer="2">{{PHRASE}}</div>
    <div class="url" data-layer="3">{{CLUB_URL}}</div>
    <div class="meet" data-layer="3">{{MEETING_TIME}}</div>
  </div>
  <!-- Creator, club, District and © year are required end credits (p.35). -->
  <div class="credit" data-layer="1">{{CREDIT}}</div>
</div>
</body></html>
