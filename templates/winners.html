<!DOCTYPE html>
<!-- The winner tiles are generated from meeting.conf by build.sh. The row gets
     an .n1/.n2/.n3 class so tile size is chosen here in CSS, not in the script.
     Each tile is its own data-layer (2, 3, 4) so they arrive one after another. -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"><style>
.wrap{text-align:center}
.eyebrow{padding-top:74px;color:var(--tm-yellow);font-weight:600;font-size:25px;letter-spacing:8px}
h1{color:#fff;font-weight:700;font-size:78px;letter-spacing:2px;margin-top:18px}
.row{display:flex;justify-content:center;gap:90px;margin-top:58px}
.card img{display:block;width:auto;object-fit:cover;border-radius:18px;border:3px solid rgba(255,255,255,.9);box-shadow:0 18px 60px rgba(0,0,0,.45)}
.name{margin-top:30px;color:#fff;font-weight:700;font-size:44px;letter-spacing:5px}
.award{margin-top:12px;color:var(--tm-yellow);font-weight:500;font-size:27px;letter-spacing:1px}
/* Tiles share a height and take their width from the source aspect, so a
   portrait Zoom tile sits beside landscape ones without being cropped to fit.
   A landscape crop at ~1.89:1 still lands on the old widths; 3 across is
   1860px incl. gaps. */
.n1 .card img{height:477px;max-width:900px}
.n2 .card img{height:392px;max-width:740px}
.n3 .card img{height:297px;max-width:560px}
.n3 .name{font-size:38px;letter-spacing:4px} .n3 .award{font-size:24px}

/* Portrait: the one real layout change in the kit. Three tiles do not fit
   across 1080px, so the row becomes a column and tiles take a width with the
   height following the source aspect, which is the mirror of the landscape
   rule above. Sizes are chosen so three tiles plus the header still land inside
   the 1080x1350 safe zone; a feed crop keeps every winner, which is exactly
   what a centre-cropped 16:9 winners card failed to do. */
body[data-aspect="portrait"] .eyebrow{padding-top:calc(var(--safe-y) + 20px)}
body[data-aspect="portrait"] h1{font-size:58px}
body[data-aspect="portrait"] .row{flex-direction:column;align-items:center;gap:44px;margin-top:34px}
body[data-aspect="portrait"] .card img{height:auto}
body[data-aspect="portrait"] .n1 .card img{width:880px;max-width:none;max-height:640px}
body[data-aspect="portrait"] .n2 .card img{width:700px;max-width:none;max-height:460px}
body[data-aspect="portrait"] .n3 .card img{width:500px;max-width:none;max-height:290px}
body[data-aspect="portrait"] .n3{gap:28px}
body[data-aspect="portrait"] .n3 .name{margin-top:22px;font-size:30px;letter-spacing:3px}
body[data-aspect="portrait"] .n3 .award{font-size:21px}
</style></head><body data-aspect="{{ASPECT}}">
<div class="wrap">
  <div class="eyebrow" data-layer="1">MEETING HIGHLIGHTS</div>
  <h1 data-layer="1">Congratulations!</h1>
  <div class="row n{{WINNER_COUNT}}">{{WINNER_CARDS}}</div>
</div>
</body></html>
