# Per-meeting settings. Edit this file, then run `templates/build.sh`.
#
# Every value here is substituted into templates/*.html at render time and
# HTML-escaped on the way in, so `&`, `<`, `>` and quotes are safe to type
# literally (e.g. CLUB_NAME="Rock & Roll Toastmasters").

# ---- Club identity (set once, then leave alone) -----------------------------

CLUB_NAME="YOUR CLUB TOASTMASTERS"
CLUB_URL="yourclub.toastmastersclubs.org"

# Brand Manual p.35 requires creator, club, District, and © year in the credits.
CREDIT="Created by Your Name · Your Club Toastmasters, Area X, District NN · © 2026 Your Club Toastmasters"

# ONE approved phrase per video (Brand Manual). Pick from this list — the build
# rejects anything else, and picks one at random if you leave it empty:
#
#   Find Your Voice
#   Relax, present confidently.
#   Relax, speak confidently.
#   Communicate Confidently®
#   100 Years of Confident Voices
#   Find your confidence
#   Become a better leader
#   Invest in a Brighter Future
#
# Casing, spacing and the ® are normalized for you, so "communicate confidently"
# renders as "Communicate Confidently®".
PHRASE="Find Your Voice"

# ---- This meeting -----------------------------------------------------------

# Use the full date. Meetings are usually weekly, so the month alone can't tell
# one recap apart from the next.
MEETING_DATE="AUGUST 5, 2026"

# The theme, split across two display lines. Leave THEME_LINE2 empty for a
# single-line theme.
THEME_LINE1="YOUR"
THEME_LINE2="THEME"

WORD_OF_DAY="ELOQUENT"

# ---- Winners (1-3) ----------------------------------------------------------
#
# Leave a NAME empty to drop that tile; the row re-centers and resizes itself.
# Images are landscape "Zoom tile" crops taken from the group photo, positioned
# to exclude the Zoom name labels. See README "4. Crop winner portraits".

WINNER1_NAME="FIRST NAME"
WINNER1_AWARD="Best Speaker"
WINNER1_IMG="assets/winner1_crop.png"

WINNER2_NAME="FIRST NAME"
WINNER2_AWARD="Best Evaluator"
WINNER2_IMG="assets/winner2_crop.png"

WINNER3_NAME=""
WINNER3_AWARD=""
WINNER3_IMG=""

# ---- Inputs -----------------------------------------------------------------
#
# Paths are relative to the repo root. None of these files ship with the repo —
# see README "What you need to supply".

BG_VIDEO="assets/bg.mp4"                        # 8s Veo background, no text
GROUP_PHOTO="assets/group_photo.png"            # meeting photo, untouched
LOGO="assets/ToastmastersLogoWhite.png"         # official white TI logo

# The meeting scene takes a still by default. Set GROUP_VIDEO to a clip — a Zoom
# gallery recording, someone mid-speech — and it plays there instead, framed in
# the same card. Leave it empty for a photo-only recap.
#
# The clip is always silent: the Veo background music is the only audio in the
# piece, so a room full of overlapping voices can't muddy it. The scene is 4.6s,
# so GROUP_VIDEO_START picks which 4.6 seconds of a long recording to use; a
# shorter remainder just holds on its last frame.
#
# Zoom gallery view reflows when people join or leave, so record with the
# speaker spotlighted if you want to be sure of the framing.
GROUP_VIDEO=""                                  # e.g. assets/meeting.mp4
GROUP_VIDEO_START="0"                           # seconds into GROUP_VIDEO

# ---- Output -----------------------------------------------------------------

OUTPUT="Meeting_Recap.mp4"
