# Per-meeting settings. Edit this file, then run `templates/build.sh`.
#
# build.sh reads this file as data, not as shell: every KEY="value" is taken
# literally, so `$`, backticks and `&`/`<`/`>` are all safe to type as-is (e.g.
# CLUB_NAME="Rock & Roll Toastmasters"), and values are HTML-escaped on the way
# into templates/*.html. The one character a value can't contain is a double
# quote (there is no escape for it inside the quotes); write around it instead
# of trying to include one.

# ---- Club identity (set once, then leave alone) -----------------------------

CLUB_NAME="YOUR CLUB TOASTMASTERS"
CLUB_URL="yourclub.toastmastersclubs.org"

# Optional standing meeting time, shown on the closing card. Leave it empty and
# the card renders exactly as it does without this line. Keep it short: a viewer
# has about three seconds, so a day and a time land and a long URL does not.
# Put the join link in the post caption instead, where it is clickable.
MEETING_TIME=""                                 # e.g. "WEDNESDAYS · 7:00-8:30 PM PT · ON ZOOM"

# Brand Manual p.35 requires creator, club, District, and © year in the credits.
CREDIT="Created by Your Name · Your Club Toastmasters, Area X, District NN · © 2026 Your Club Toastmasters"

# ONE approved phrase per video (Brand Manual). Pick from this list; the build
# rejects anything else, and picks one at random if you leave it empty:
#
#   Find Your Voice
#   Relax, present confidently.
#   Relax, speak confidently.
#   Communicate Confidently®
#   100 Years of Confident Voices
#   Find your confidence
#   Become a better leader
#   Invest in a Brighter Future
#
# Casing, spacing and the ® are normalized for you, so "communicate confidently"
# renders as "Communicate Confidently®".
#
# Rotate it. The Brand Manual allows one approved phrase per piece, not the same
# one every week, and a viewer who sees three recaps in a row is looking at your
# closing card three times. Nothing enforces this: the dated per-meeting configs
# are local and untracked, so no repo check can read your history. Before you
# pick, look at what the last few weeks used:
#
#   grep -H '^PHRASE=' *.conf | sort
#
PHRASE="Find Your Voice"

# ---- This meeting -----------------------------------------------------------

# Use the full date. Meetings are usually weekly, so the month alone can't tell
# one recap apart from the next.
MEETING_DATE="AUGUST 5, 2026"

# The theme, split across two display lines. Leave THEME_LINE2 empty for a
# single-line theme.
THEME_LINE1="YOUR"
THEME_LINE2="THEME"

WORD_OF_DAY="ELOQUENT"
# Optional one-line definition under the word of the day. Leave it empty and the
# title card renders exactly as it did without this line. Keep it to one line.
WORD_DEF=""                                    # e.g. "fluent or persuasive in speaking"

# Optional: the member who ran the meeting, shown on the title card. Leave it
# empty and the line is hidden.
TOASTMASTER=""                                 # e.g. "FIRST NAME"
TOASTMASTER_IMG=""                             # optional square crop, e.g. "assets/toastmaster.png"

# ---- Winners (1-3) ----------------------------------------------------------
#
# Leave a NAME empty to drop that tile; the row re-centers and resizes itself.
# Images are landscape "Zoom tile" crops taken from the group photo, positioned
# to exclude the Zoom name labels. See README "4. Crop winner portraits".

WINNER1_NAME="FIRST NAME"
WINNER1_AWARD="Best Speaker"
WINNER1_IMG="assets/winner1_crop.png"

WINNER2_NAME="FIRST NAME"
WINNER2_AWARD="Best Evaluator"
WINNER2_IMG="assets/winner2_crop.png"

WINNER3_NAME=""
WINNER3_AWARD=""
WINNER3_IMG=""

# ---- Inputs -----------------------------------------------------------------
#
# Paths are relative to the repo root. None of these files ship with the repo;
# see README "What you need to supply".

BG_VIDEO="assets/bg.mp4"                        # 8s Veo background, no text
GROUP_PHOTO="assets/group_photo.png"            # meeting photo, untouched
LOGO="assets/ToastmastersLogoWhite.png"         # official white TI logo

# ---- Background policy -------------------------------------------------------
#
# BG_MODE decides whether the background is reused or generated fresh. It is the
# only setting in this file that can cost money, so it defaults to "reuse" and
# nothing here ever generates on its own: the agent asks first, every time.
#
#   reuse     Use BG_VIDEO exactly as it is. Zero credits. Every recap shares one
#             background, which gives a season of videos a consistent signature.
#   generate  Ask for a fresh clip before each build, so no two recaps look alike.
#             About 12 credits per 8-second clip on the cheapest model, so a
#             weekly club spends roughly 50 a month.
#
# Credits are the smaller consideration. The reason this step is fenced is that
# the model returns something different every run and cannot be trusted with
# anything that has to be correct. That is true whether you generate once or
# every week, which is why BG_MOOD below describes light and never words.
BG_MODE="reuse"                                 # reuse | generate

# BG_MOOD steers a generated background toward the meeting's theme. It is read
# only when BG_MODE="generate".
#
# Describe light, colour and movement. Never put the theme itself in here. The
# theme is TEXT, and text in a Veo prompt is the single most reliable way to get
# garbled lettering drifting across your background: a prompt carrying the hex
# code "#F2DF74" once came back as a gold ribbon reading "Best #2DF74". The theme
# words already reach the video through THEME_LINE1/THEME_LINE2, where Chrome
# renders them locally and you proofread them as a still.
#
# Translate the theme into weather, not vocabulary:
#
#   FRESH START      "cool dawn palette, pale green and soft gold, light rising
#                     from below"
#   MILESTONES       "deep indigo, slow upward drift of warm sparks"
#   FIND YOUR VOICE  "warm amber gradient, gentle concentric ripples spreading
#                     outward from the centre"
#   WINTER           "cold blue-white, slow drifting particles, low contrast"
#
# Leave it empty and a generated clip falls back to the house look: deep navy
# with slow diagonal light rays and drifting gold dust.
BG_MOOD=""                                      # e.g. "cool dawn palette, pale green"
# MUSIC replaces the soundtrack. Left empty, the piece keeps the background
# clip's own Veo audio, crossfaded against itself to fill 15s, which is what
# every recap before this one used. Point MUSIC at an audio file and that track
# takes over instead.
#
# Generated music comes back minutes long, so MUSIC_START picks where the 15
# seconds we keep begin: set it to the point the track actually gets good, not
# to 0 out of habit. A short fade-in covers the in-point, and the usual fade-out
# still lands at 13.6s.
#
# Instrumental only. A sung lyric is AI-generated words in a piece whose whole
# premise is that no AI writes anything, so ask for "no vocals, no lyrics, no
# vocal chops" and check what comes back before using it.
MUSIC=""                                        # e.g. "assets/sting.wav"
MUSIC_START="0"                                 # seconds into MUSIC to start

# The meeting scene takes a still by default. Set GROUP_VIDEO to a clip (a Zoom
# gallery recording, someone mid-speech) and it plays there instead, framed in
# the same card. Leave it empty for a photo-only recap.
#
# The clip is always silent: the Veo background music is the only audio in the
# piece, so a room full of overlapping voices can't muddy it. The scene is 4.6s,
# so GROUP_VIDEO_START picks which 4.6 seconds of a long recording to use; a
# shorter remainder just holds on its last frame.
#
# Zoom gallery view reflows when people join or leave, so record with the
# speaker spotlighted if you want to be sure of the framing.
GROUP_VIDEO=""                                  # e.g. assets/meeting.mp4
GROUP_VIDEO_START="0"                           # seconds into GROUP_VIDEO

# ---- Output -----------------------------------------------------------------

# portrait  = 1080x1920, for Reels, Shorts, TikTok and the vertical feed
# landscape = 1920x1080, for YouTube or embedding on a club site
# Both shapes build from the same templates; only the size-sensitive rules fork.
# A 16:9 background clip still works in a portrait build (centre crop, 0 credits);
# a clip generated at 9:16 is sharper.
ASPECT="portrait"                               # portrait | landscape

OUTPUT="Meeting_Recap.mp4"
